<!DOCTYPE html>
<html>

<head>
  <title>String Comparison</title>
</head>

<body>

  <h2>String Comparison</h2>

  Enter First String:
  <input type="text" id="str1">
  <br><br>

  Enter Second String:
  <input type="text" id="str2">
  <br><br>

  <button onclick="compareStrings()">Compare</button>
  <button onclick="resetForm()">Reset</button>

  <p id="result"></p>

  <script>
    function compareStrings() {
      let str1 = document.getElementById("str1").value;
      let str2 = document.getElementById("str2").value;

      let strictResult = (str1 === str2);
      let looseResult = (str1 == str2);

      let lengthResult;

      if (str1.length == str2.length) {
        lengthResult = "Both strings have equal length";
      }
      else if (str1.length > str2.length) {
        lengthResult = "First string is longer";
      }
      else {
        lengthResult = "Second string is longer";
      }

      document.getElementById("result").innerHTML =
        "Strict Equality (===): " + strictResult + "<br>" +
        "Loose Equality (==): " + looseResult + "<br>" +
        "Length Comparison: " + lengthResult;
    }

    function resetForm() {
      document.getElementById("str1").value = "";
      document.getElementById("str2").value = "";
      document.getElementById("result").innerHTML = "";
    }
  </script>

</body>

</html>
